[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-scan-modeling"
version = "0.1.0"
description = "LiDAR point cloud measurement modelling"
requires-python = ">=3.11"
dependencies = ["laspy[lazrs]>=2.5", "pye57>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lidar-scan-modeling = "lidar_scan.cli:main"

[tool.setuptools]
packages = ["lidar_scan"]
